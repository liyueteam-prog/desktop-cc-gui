name: Build signed RuYuanAI macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ruyuanai-macos-install
    paths:
      - .github/workflows/build-macos-dmg.yml
      - package.json
      - pnpm-lock.yaml
      - src/**
      - src-tauri/**

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.name }} signed and notarized
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple-Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            output_name: RuYuanAI_1.0.7_macOS_AppleSilicon.dmg
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            output_name: RuYuanAI_1.0.7_macOS_Intel.dmg

    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
      CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
      NOTARY_PROFILE_NAME: ${{ vars.NOTARY_PROFILE_NAME }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
          shared-key: ruyuanai-1.0.7-signed-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/ruyuan-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/ruyuan-developer-id.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH" 2>/dev/null || \
            echo "$APPLE_CERTIFICATE_P12" | base64 -D > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Configure Apple notarization
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$NOTARY_PROFILE_NAME"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_API_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH" 2>/dev/null || \
            echo "$APPLE_API_PRIVATE_KEY_B64" | base64 -D > "$KEY_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE_NAME" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --key "$KEY_PATH"

      - name: Build signed application and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY"
          for attempt in 1 2 3; do
            if pnpm exec tauri build \
              --target "${{ matrix.target }}" \
              --bundles app,dmg \
              --ci \
              --config '{"bundle":{"createUpdaterArtifacts":false}}'; then
              exit 0
            fi
            echo "DMG build attempt ${attempt} failed"
            sleep 5
          done
          exit 1

      - name: Verify signature, notarize and staple
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          APP=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          DMG=$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$APP"
          test -n "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign-${TARGET}.txt"
          xcrun notarytool submit "$DMG" --keychain-profile "$NOTARY_PROFILE_NAME" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Collect verified DMG
        shell: bash
        env:
          OUTPUT_NAME: ${{ matrix.output_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p outputs
          DMG=$(find "src-tauri/target/${TARGET}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$DMG"
          cp "$DMG" "outputs/${OUTPUT_NAME}"
          shasum -a 256 "outputs/${OUTPUT_NAME}" | tee "outputs/${OUTPUT_NAME}.sha256"

      - name: Upload signed macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: RuYuanAI-1.0.7-signed-macOS-${{ matrix.name }}
          path: outputs/*
          if-no-files-found: error
          retention-days: 14
